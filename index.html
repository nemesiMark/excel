<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excel</title>
<meta name="description" content="Excel, un foglio di calcolo nel browser che apre e salva file .xlsx.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2321a366'/%3E%3Cstop offset='1' stop-color='%23085c36'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cg fill='%23fff'%3E%3Crect x='9' y='8' width='4' height='16' rx='1.4'/%3E%3Crect x='14.5' y='8' width='9' height='4' rx='1.4'/%3E%3Crect x='14.5' y='14' width='7' height='4' rx='1.4' /%3E%3Crect x='14.5' y='20' width='9' height='4' rx='1.4'/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111312" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone/icona-180.png">
<meta name="apple-mobile-web-app-title" content="Excel">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
    <symbol id="i-paste" viewBox="0 0 24 24"><path d="M9 4H6.5A1.5 1.5 0 0 0 5 5.5v14A1.5 1.5 0 0 0 6.5 21H10"/><path d="M15 4h2.5A1.5 1.5 0 0 1 19 5.5V9"/><rect x="9" y="2.5" width="6" height="3.5" rx="1"/><rect x="12" y="11" width="8.5" height="10.5" rx="1.2"/></symbol>
    <symbol id="i-cut" viewBox="0 0 24 24"><circle cx="6.5" cy="17.5" r="2.8"/><circle cx="17.5" cy="17.5" r="2.8"/><path d="M8.5 15.5 18 3M15.5 15.5 6 3"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="12" height="12" rx="1.5"/><path d="M15.5 8.5V5A1.5 1.5 0 0 0 14 3.5H5A1.5 1.5 0 0 0 3.5 5v9A1.5 1.5 0 0 0 5 15.5h3.5"/></symbol>
    <symbol id="i-color" viewBox="0 0 24 24"><path d="m6.5 16 5.5-12 5.5 12M8.7 11.5h6.6"/></symbol>
    <symbol id="i-fill" viewBox="0 0 24 24"><path d="m11 3.5 7 7-6.5 6.5a1.5 1.5 0 0 1-2.1 0L4.5 12.1a1.5 1.5 0 0 1 0-2.1zM5 10.5h12.5M19.5 13.5s1.5 2 1.5 3a1.5 1.5 0 0 1-3 0c0-1 1.5-3 1.5-3z"/></symbol>
    <symbol id="i-borders" viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 12h16M12 4v16" stroke-dasharray="2 2.4"/><path d="M4 20h16" stroke-width="2.4"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></symbol>
    <symbol id="i-center" viewBox="0 0 24 24"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></symbol>
    <symbol id="i-wrap" viewBox="0 0 24 24"><path d="M4 6h16M4 12h13a3 3 0 0 1 0 6h-4M15 16l-2 2 2 2M4 18h5"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-sigma" viewBox="0 0 24 24"><path d="M18 5H6l6 7-6 7h12"/></symbol>
    <symbol id="i-filldown" viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="1.5"/><path d="M12 7v9M8.5 12.5 12 16l3.5-3.5"/></symbol>
    <symbol id="i-erase" viewBox="0 0 24 24"><path d="m14 4 6 6-9 9H6l-3-3zM9 9l6 6M11 19h10"/></symbol>
    <symbol id="i-sortaz" viewBox="0 0 24 24"><path d="M17 4v16M13.5 16.5 17 20l3.5-3.5"/><path d="M4 10.5 6.5 4 9 10.5M4.8 8.5h3.4M4 14h5l-5 6h5"/></symbol>
    <symbol id="i-sortza" viewBox="0 0 24 24"><path d="M17 4v16M13.5 16.5 17 20l3.5-3.5"/><path d="M4 4h5l-5 6h5M4 20.5 6.5 14 9 20.5M4.8 18.5h3.4"/></symbol>
    <symbol id="i-find" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m20 20-5-5"/></symbol>
    <symbol id="i-row-ins" viewBox="0 0 24 24"><rect x="3.5" y="11" width="17" height="9.5" rx="1"/><path d="M3.5 15.7h17M12 2.5v6M9 5.5h6"/></symbol>
    <symbol id="i-col-ins" viewBox="0 0 24 24"><rect x="11" y="3.5" width="9.5" height="17" rx="1"/><path d="M15.7 3.5v17M2.5 12h6M5.5 9v6"/></symbol>
    <symbol id="i-row-del" viewBox="0 0 24 24"><rect x="3.5" y="8" width="17" height="8" rx="1"/><path d="m9 10 6 4M15 10l-6 4"/></symbol>
    <symbol id="i-col-del" viewBox="0 0 24 24"><rect x="8" y="3.5" width="8" height="17" rx="1"/><path d="m10 9 4 6M14 9l-4 6"/></symbol>
    <symbol id="i-fx" viewBox="0 0 24 24"><path d="M10 4.5c-2 0-2.5 1.5-2.8 3.5L5.5 19.5c-.3 1.6-1 2-2 2M4.5 10h6M13 10l6 8M19 10l-6 8"/></symbol>
    <symbol id="i-date" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h2M12 14h2M8 17h2"/></symbol>
    <symbol id="i-rows" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5"/><path d="M3.5 9h17M3.5 14.5h17M12 17v6M9 20h6" /></symbol>
    <symbol id="i-freeze" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5"/><path d="M3.5 8.5h17" stroke-width="2.6"/><path d="M8.5 3.5v17" stroke-width="2.6"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><path d="M3.5 3.5h17v17h-17zM3.5 9.2h17M3.5 14.8h17M9.2 3.5v17M14.8 3.5v17"/></symbol>
    <symbol id="i-zoom" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m20 20-5-5M8 10.5h5M10.5 8v5"/></symbol>
    <symbol id="i-theme" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-csv" viewBox="0 0 24 24"><path d="M14 3.5H6.5a1.5 1.5 0 0 0-1.5 1.5v14a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5V8.5z"/><path d="M14 3.5v5h5M8 13h8M8 16.5h8M11 11v8"/></symbol>
    <symbol id="i-dup" viewBox="0 0 24 24"><rect x="3.5" y="4" width="11" height="4" rx="1"/><rect x="3.5" y="10" width="11" height="4" rx="1"/><rect x="3.5" y="16" width="11" height="4" rx="1" stroke-dasharray="2 2"/><path d="m17 15 4 4M21 15l-4 4"/></symbol>
  </defs>
</svg>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <defs><linearGradient id="brandG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#21a366"/><stop offset="1" stop-color="#085c36"/></linearGradient></defs>
      <rect width="32" height="32" rx="8" fill="url(#brandG)" stroke="none"/>
      <rect x=".5" y=".5" width="31" height="31" rx="7.5" fill="none" stroke="#fff" stroke-opacity=".18"/>
      <g fill="#fff" stroke="none"><rect x="9" y="8" width="4" height="16" rx="1.4"/><rect x="14.5" y="8" width="9" height="4" rx="1.4"/><rect x="14.5" y="14" width="7" height="4" rx="1.4"/><rect x="14.5" y="20" width="9" height="4" rx="1.4"/></g>
    </svg>
    <span class="brand-name">Excel</span>
  </div>
  <div class="quick">
    <button class="qb" id="btnUndo" title="Annulla (⌘Z)"><svg><use href="#i-undo"/></svg></button>
    <button class="qb" id="btnRedo" title="Ripeti (⌘⇧Z)"><svg><use href="#i-redo"/></svg></button>
  </div>
  <div class="doc-meta">
    <input id="title" class="title" value="Cartella senza titolo" aria-label="Titolo della cartella" spellcheck="false">
    <span id="saveState" class="save-state">Salvato</span>
  </div>
  <nav class="file-actions" aria-label="File">
    <button class="btn ghost" id="btnNew">Nuovo</button>
    <button class="btn ghost" id="btnOpen">Apri…</button>
    <button class="btn ghost" id="btnPdf">PDF</button>
    <button class="btn primary" id="btnSave">Scarica .xlsx</button>
  </nav>
  <input type="file" id="fileOpen" accept=".xlsx,.csv,.tsv,.txt" hidden>
</header>

<div class="ribbon-tabs" role="tablist" aria-label="Schede">
  <button role="tab" class="rtab" data-tab="home" aria-selected="true">Home</button>
  <button role="tab" class="rtab" data-tab="insert" aria-selected="false">Inserisci</button>
  <button role="tab" class="rtab" data-tab="formulas" aria-selected="false">Formule</button>
  <button role="tab" class="rtab" data-tab="data" aria-selected="false">Dati</button>
  <button role="tab" class="rtab" data-tab="view" aria-selected="false">Visualizza</button>
</div>

<div class="ribbon" id="ribbon">
  <!-- ===== HOME ===== -->
  <section class="panel" data-panel="home" role="tabpanel">
    <div class="rgroup">
      <button class="big" id="btnPaste" title="Incolla (⌘V)"><svg><use href="#i-paste"/></svg><span>Incolla</span></button>
      <div class="col">
        <button class="tb" id="btnCut" title="Taglia (⌘X)"><svg><use href="#i-cut"/></svg></button>
        <button class="tb" id="btnCopy" title="Copia (⌘C)"><svg><use href="#i-copy"/></svg></button>
      </div>
    </div>

    <div class="rgroup">
      <div class="rows">
        <div class="row">
          <select id="fontSize" class="sel sel-size" title="Dimensione (pt)">
            <option>8</option><option>9</option><option>10</option><option selected>11</option><option>12</option>
            <option>14</option><option>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>36</option>
          </select>
          <span class="vsep"></span>
          <button class="tb wide" data-pop="popBorders" title="Bordi"><svg><use href="#i-borders"/></svg><svg class="chev"><use href="#i-down"/></svg></button>
          <label class="tb color" title="Colore di riempimento">
            <svg><use href="#i-fill"/></svg>
            <span class="swatch" id="swFill" style="background:#fff2a8"></span>
            <input type="color" id="fillColor" value="#fff2a8">
          </label>
          <label class="tb color" title="Colore del testo">
            <svg><use href="#i-color"/></svg>
            <span class="swatch" id="swText" style="background:#c0392b"></span>
            <input type="color" id="textColor" value="#c0392b">
          </label>
        </div>
        <div class="row">
          <button class="tb glyph b" data-style="b" title="Grassetto (⌘B)">G</button>
          <button class="tb glyph i" data-style="i" title="Corsivo (⌘I)">C</button>
          <button class="tb glyph u" data-style="u" title="Sottolineato (⌘U)">S</button>
          <button class="tb glyph s" data-style="st" title="Barrato">ab</button>
          <span class="vsep"></span>
          <button class="tb" data-pop="popClear" title="Cancella"><svg><use href="#i-erase"/></svg><svg class="chev"><use href="#i-down"/></svg></button>
        </div>
      </div>
    </div>

    <div class="rgroup">
      <div class="rows">
        <div class="row">
          <button class="tb" data-align="left" title="Allinea a sinistra"><svg><use href="#i-left"/></svg></button>
          <button class="tb" data-align="center" title="Centra"><svg><use href="#i-center"/></svg></button>
          <button class="tb" data-align="right" title="Allinea a destra"><svg><use href="#i-right"/></svg></button>
        </div>
        <div class="row">
          <button class="tb" id="btnWrap" title="Testo a capo"><svg><use href="#i-wrap"/></svg></button>
        </div>
      </div>
    </div>

    <div class="rgroup">
      <div class="rows">
        <div class="row">
          <select id="numFmt" class="sel sel-fmt" title="Formato numeri">
            <option value="general">Generale</option>
            <option value="number">Numero</option>
            <option value="currency">Valuta (€)</option>
            <option value="percent">Percentuale</option>
            <option value="date">Data</option>
            <option value="datetime">Data e ora</option>
            <option value="text">Testo</option>
          </select>
        </div>
        <div class="row">
          <button class="tb glyph" data-fmt="currency" title="Valuta (€)">€</button>
          <button class="tb glyph" data-fmt="percent" title="Percentuale">%</button>
          <button class="tb glyph small" data-fmt="number" title="Separatore delle migliaia">000</button>
          <span class="vsep"></span>
          <button class="tb glyph small" id="btnDecMore" title="Aumenta decimali">,0→</button>
          <button class="tb glyph small" id="btnDecLess" title="Riduci decimali">←,0</button>
        </div>
      </div>
    </div>

    <div class="rgroup">
      <div class="rows">
        <div class="row">
          <button class="tb lbl-btn" data-struct="insRow" title="Inserisci una riga sopra"><svg><use href="#i-row-ins"/></svg><span>Inserisci riga</span></button>
          <button class="tb lbl-btn" data-struct="insCol" title="Inserisci una colonna a sinistra"><svg><use href="#i-col-ins"/></svg><span>Inserisci colonna</span></button>
        </div>
        <div class="row">
          <button class="tb lbl-btn" data-struct="delRow" title="Elimina le righe selezionate"><svg><use href="#i-row-del"/></svg><span>Elimina riga</span></button>
          <button class="tb lbl-btn" data-struct="delCol" title="Elimina le colonne selezionate"><svg><use href="#i-col-del"/></svg><span>Elimina colonna</span></button>
        </div>
      </div>
    </div>

    <div class="rgroup">
      <div class="rows">
        <div class="row">
          <button class="tb lbl-btn" id="btnAutoSum" title="Somma automatica"><svg><use href="#i-sigma"/></svg><span>Somma</span></button>
          <button class="tb" data-pop="popAuto" title="Altre funzioni rapide"><svg class="chev"><use href="#i-down"/></svg></button>
          <button class="tb lbl-btn" data-pop="popSort" title="Ordina"><svg><use href="#i-sortaz"/></svg><span>Ordina</span><svg class="chev"><use href="#i-down"/></svg></button>
        </div>
        <div class="row">
          <button class="tb lbl-btn" data-pop="popFill" title="Riempi"><svg><use href="#i-filldown"/></svg><span>Riempi</span><svg class="chev"><use href="#i-down"/></svg></button>
          <button class="tb lbl-btn" id="btnFind" title="Trova (⌘F)"><svg><use href="#i-find"/></svg><span>Trova</span></button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== INSERISCI ===== -->
  <section class="panel" data-panel="insert" role="tabpanel" hidden>
    <div class="rgroup">
      <button class="big" data-struct="insRow"><svg><use href="#i-row-ins"/></svg><span>Riga</span></button>
      <button class="big" data-struct="insCol"><svg><use href="#i-col-ins"/></svg><span>Colonna</span></button>
      <button class="big" id="btnAddRows"><svg><use href="#i-rows"/></svg><span>100 righe<br>in fondo</span></button>
    </div>
    <div class="rgroup">
      <button class="big" id="btnAddSheet"><svg><use href="#i-grid"/></svg><span>Nuovo<br>foglio</span></button>
    </div>
    <div class="rgroup">
      <button class="big" id="btnToday"><svg><use href="#i-date"/></svg><span>Data<br>di oggi</span></button>
      <button class="big" data-pop="popFunctions"><svg><use href="#i-fx"/></svg><span>Funzione <svg class="chev in"><use href="#i-down"/></svg></span></button>
    </div>
  </section>

  <!-- ===== FORMULE ===== -->
  <section class="panel" data-panel="formulas" role="tabpanel" hidden>
    <div class="rgroup">
      <button class="big" data-pop="popFunctions"><svg><use href="#i-fx"/></svg><span>Inserisci<br>funzione</span></button>
      <button class="big" id="btnAutoSum2"><svg><use href="#i-sigma"/></svg><span>Somma<br>automatica</span></button>
    </div>
    <div class="rgroup">
      <button class="big" data-fgroup="math"><span class="big-glyph">∑</span><span>Matematica <svg class="chev in"><use href="#i-down"/></svg></span></button>
      <button class="big" data-fgroup="logic"><span class="big-glyph">?</span><span>Logiche <svg class="chev in"><use href="#i-down"/></svg></span></button>
      <button class="big" data-fgroup="text"><span class="big-glyph">A</span><span>Testo <svg class="chev in"><use href="#i-down"/></svg></span></button>
      <button class="big" data-fgroup="date"><svg><use href="#i-date"/></svg><span>Data <svg class="chev in"><use href="#i-down"/></svg></span></button>
      <button class="big" data-fgroup="lookup"><svg><use href="#i-find"/></svg><span>Ricerca <svg class="chev in"><use href="#i-down"/></svg></span></button>
    </div>
    <div class="rgroup">
      <button class="big toggle" id="btnShowFormulas"><span class="big-glyph">=</span><span>Mostra<br>formule</span></button>
    </div>
  </section>

  <!-- ===== DATI ===== -->
  <section class="panel" data-panel="data" role="tabpanel" hidden>
    <div class="rgroup">
      <button class="big" data-sort="asc"><svg><use href="#i-sortaz"/></svg><span>Ordina<br>A → Z</span></button>
      <button class="big" data-sort="desc"><svg><use href="#i-sortza"/></svg><span>Ordina<br>Z → A</span></button>
    </div>
    <div class="rgroup">
      <button class="big" id="btnDedup"><svg><use href="#i-dup"/></svg><span>Rimuovi<br>duplicati</span></button>
    </div>
    <div class="rgroup">
      <button class="big" id="btnImportCsv"><svg><use href="#i-csv"/></svg><span>Importa<br>CSV</span></button>
      <button class="big" id="btnExportCsv"><svg><use href="#i-csv"/></svg><span>Esporta<br>CSV</span></button>
    </div>
  </section>

  <!-- ===== VISUALIZZA ===== -->
  <section class="panel" data-panel="view" role="tabpanel" hidden>
    <div class="rgroup">
      <button class="big toggle" id="btnFreezeRow"><svg><use href="#i-freeze"/></svg><span>Blocca<br>riga 1</span></button>
      <button class="big toggle" id="btnFreezeCol"><svg><use href="#i-freeze"/></svg><span>Blocca<br>colonna A</span></button>
    </div>
    <div class="rgroup">
      <button class="big toggle on" id="btnGrid"><svg><use href="#i-grid"/></svg><span>Griglia</span></button>
      <button class="big" id="btnZoom100"><svg><use href="#i-zoom"/></svg><span>100%</span></button>
    </div>
    <div class="rgroup">
      <button class="big" id="btnTheme"><svg><use href="#i-theme"/></svg><span id="themeLabel">Tema: auto</span></button>
      <button class="big" id="btnFull"><svg><use href="#i-full"/></svg><span>Schermo<br>intero</span></button>
    </div>
  </section>
</div>

<!-- Barra della formula -->
<div class="formulabar">
  <input id="nameBox" class="namebox" value="A1" aria-label="Cella attiva (scrivi un indirizzo per andarci)" spellcheck="false">
  <span class="fx" aria-hidden="true">fx</span>
  <input id="formulaInput" class="formula" aria-label="Contenuto della cella" spellcheck="false" autocomplete="off">
</div>

<div class="findbar" id="findbar" hidden>
  <input id="findInput" placeholder="Trova" aria-label="Testo da trovare">
  <input id="replaceInput" placeholder="Sostituisci con" aria-label="Testo sostitutivo">
  <button class="btn small" id="findNext">Successivo</button>
  <button class="btn small" id="replaceAll">Sostituisci tutto</button>
  <span class="find-count" id="findCount"></span>
  <button class="btn small ghost" id="findClose" aria-label="Chiudi">✕</button>
</div>

<main class="sheet-wrap" id="wrap" tabindex="0" aria-label="Celle del foglio">
  <table class="grid" id="grid"></table>
  <div class="sel-box" id="selBox"></div>
  <div class="fill-handle" id="fillHandle" title="Trascina per riempire"></div>
  <textarea class="cell-editor" id="cellEditor" spellcheck="false" hidden></textarea>
</main>

<footer class="sheetbar">
  <div class="sheet-tabs" id="sheetTabs"></div>
  <button class="add-sheet" id="btnAddSheet2" title="Nuovo foglio">+</button>
  <span class="spacer"></span>
  <span class="sel-stats" id="selStats"></span>
  <label class="zoom">
    <input type="range" id="zoom" min="50" max="200" step="10" value="100" aria-label="Zoom">
    <output id="zoomOut">100%</output>
  </label>
</footer>

<!-- Menu a comparsa -->
<div class="popover menu" id="popBorders" hidden>
  <button data-border="all">Tutti i bordi</button>
  <button data-border="outer">Bordo esterno</button>
  <button data-border="bottom">Bordo inferiore</button>
  <button data-border="thick">Bordo esterno spesso</button>
  <button data-border="none">Nessun bordo</button>
</div>
<div class="popover menu" id="popClear" hidden>
  <button data-clear="all">Cancella tutto</button>
  <button data-clear="format">Cancella formati</button>
  <button data-clear="content">Cancella contenuto</button>
</div>
